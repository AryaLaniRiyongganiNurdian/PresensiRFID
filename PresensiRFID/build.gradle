// Nama WAR menentukan context path /PresensiRFID pada Tomcat.
// Plugin war mengemas class Java dan isi src/main/webapp untuk dipasang di server servlet.
plugins {
    id 'war'
}

group = 'com.PresensiRFID'
version = '1.0'

repositories {
    mavenCentral()
}

// Server menyediakan Jakarta Servlet API. Connector/J menghubungkan Db ke MySQL,
// sedangkan Gson dipakai JsonUtil untuk menulis respons API.
dependencies {
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

war {
    archiveFileName = 'PresensiRFID.war'
}
